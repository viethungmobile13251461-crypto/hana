<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hana Der - Bio Link</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
            padding: 20px;
        }

        /* Hiệu ứng nền mờ ảo (glow background) */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(99, 102, 241, 0.15);
            filter: blur(100px);
            top: 10%;
            left: 20%;
            z-index: -1;
        }

        body::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(236, 72, 153, 0.1);
            filter: blur(100px);
            bottom: 10%;
            right: 20%;
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 35px 25px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        /* Avatar */
        .avatar-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }

        /* Thông tin cá nhân */
        h1 {
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        h1 i {
            font-size: 18px;
            color: #60a5fa;
        }

        p.bio {
            font-size: 14px;
            color: #9ca3af;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        /* Danh sách liên kết (Links) */
        .links-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 25px;
        }

        .link-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(31, 41, 55, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 14px 18px;
            border-radius: 14px;
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .link-item .left-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .link-item i.icon {
            font-size: 18px;
            width: 24px;
            text-align: center;
            color: #e5e7eb;
        }

        .link-item .fa-chevron-right {
            font-size: 12px;
            color: #6b7280;
            transition: transform 0.3s ease;
        }

        .link-item:hover {
            background: rgba(55, 65, 81, 0.8);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .link-item:hover .fa-chevron-right {
            transform: translateX(3px);
            color: #ffffff;
        }

        /* Mạng xã hội phía dưới */
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 15px;
        }

        .social-icon {
            width: 42px;
            height: 42px;
            background: rgba(31, 41, 55, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #d1d5db;
            font-size: 18px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .social-icon:hover {
            background: #ffffff;
            color: #0b0f19;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.2);
        }

        /* Footer nhỏ */
        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #4b5563;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Avatar -->
        <div class="avatar-container">
            <!-- Thay link ảnh của bạn vào src bên dưới -->
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500&auto=format&fit=crop&q=60" alt="Avatar" class="avatar">
        </div>

        <!-- Tên & Bio -->
        <h1>Hana Der <i class="fa-solid fa-circle-check" title="Verified"></i></h1>
        <p class="bio">Welcome to my space. Exploring code, design & tech universe. ✨</p>

        <!-- Các nút liên kết chính -->
        <div class="links-list">
            <a href="https://github.com/" target="_blank" class="link-item">
                <div class="left-content">
                    <i class="fa-brands fa-github icon"></i>
                    <span>GitHub Profile</span>
                </div>
                <i class="fa-solid fa-chevron-right"></i>
            </a>

            <a href="https://t.me/username" target="_blank" class="link-item">
                <div class="left-content">
                    <i class="fa-brands fa-telegram icon"></i>
                    <span>Telegram Contact</span>
                </div>
                <i class="fa-solid fa-chevron-right"></i>
            </a>

            <a href="https://facebook.com/" target="_blank" class="link-item">
                <div class="left-content">
                    <i class="fa-brands fa-facebook icon"></i>
                    <span>Facebook</span>
                </div>
                <i class="fa-solid fa-chevron-right"></i>
            </a>

            <a href="https://discord.com/" target="_blank" class="link-item">
                <div class="left-content">
                    <i class="fa-brands fa-discord icon"></i>
                    <span>Discord Server</span>
                </div>
                <i class="fa-solid fa-chevron-right"></i>
            </a>
        </div>

        <!-- Biểu tượng mạng xã hội phụ -->
        <div class="social-icons">
            <a href="#" target="_blank" class="social-icon"><i class="fa-brands fa-instagram"></i></a>
            <a href="#" target="_blank" class="social-icon"><i class="fa-brands fa-tiktok"></i></a>
            <a href="#" target="_blank" class="social-icon"><i class="fa-brands fa-youtube"></i></a>
            <a href="#" target="_blank" class="social-icon"><i class="fa-solid fa-envelope"></i></a>
        </div>

        <div class="footer">
            © 2026 Hana Der. All rights reserved.
        </div>
    </div>

</body>
</html>
